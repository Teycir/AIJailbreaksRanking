name: links
on:
  schedule: [{cron: "0 6 * * 1"}]
  workflow_dispatch:
  push: {paths: ["data/techniques.json", "scripts/check_links.py"]}
jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python3 scripts/check_links.py
