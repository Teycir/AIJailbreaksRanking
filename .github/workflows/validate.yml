name: validate
on:
  push:
  pull_request:
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install jsonschema
      - run: python3 scripts/validate.py
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/query.py --tier A --json > /dev/null
      - run: python3 scripts/query.py --tier A --csv > /dev/null
      - run: python3 scripts/query.py --id crescendo --md
      - run: python3 scripts/export_summary.py
      - run: git diff --exit-code data/techniques-summary.csv
